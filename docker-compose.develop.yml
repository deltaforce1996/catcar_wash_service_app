version: "3.8"

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: catcar_wash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: catcar_wash_db
      POSTGRES_USER: catcar
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - catcar_wash_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catcar -d catcar_wash_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: catcar_wash_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@catcarwash.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json
    networks:
      - catcar_wash_network
    depends_on:
      postgres:
        condition: service_healthy

  # EMQX MQTT Broker (MQTT + WebSocket + Dashboard)
  emqx:
    image: emqx/emqx:5.6
    container_name: catcar_wash_emqx
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT TCP
      - "8083:8083" # MQTT over WebSocket
      - "18083:18083" # EMQX Dashboard
    environment:
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=admin123
      - EMQX_LOG__CONSOLE_HANDLER__LEVEL=warning
      - EMQX_ALLOW_ANONYMOUS=true
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - catcar_wash_network

  # Backend Service (NestJS + Prisma)
  backend:
    build:
      context: ./catcar_wash_service_serve
      dockerfile: Dockerfile
    container_name: catcar_wash_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - API_PREFIX=api
      - VERSION=1.0.0
      - LOG_LEVEL=debug

      - DATABASE_URL=postgresql://catcar:password@postgres:5432/catcar_wash_db

      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRES_IN=24h
      - DEVICE_SECRET_KEY=modernchabackdoor

      - BEAM_API_URL=https://api.beamcheckout.com

      - MQTT_BROKER_URL=mqtt://emqx:1883
      - MQTT_USERNAME=admin
      - MQTT_PASSWORD=password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - catcar_wash_network
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Database Scripts (Partition & Backup)
  db_scripts:
    build:
      context: ./catcar_wash_service_script
      dockerfile: Dockerfile
    container_name: catcar_wash_db_scripts
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=catcar
      - PGPASSWORD=password
      - PGDATABASE=catcar_wash_db
      - DATABASE_URL=postgresql://catcar:password@postgres:5432/catcar_wash_db
    volumes:
      - db_backups:/app/backups
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - catcar_wash_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  emqx_data:
    driver: local
  emqx_log:
    driver: local
  db_backups:
    driver: local

networks:
  catcar_wash_network:
    driver: bridge

# ============================================================
# HOW TO RUN
# ============================================================
# Start all services:
#   docker-compose -f docker-compose.develop.yml up -d
#
# Start with rebuild:
#   docker-compose -f docker-compose.develop.yml up -d --build
#
# View logs:
#   docker-compose -f docker-compose.develop.yml logs -f
#
# Stop all services:
#   docker-compose -f docker-compose.develop.yml down
#
# Services included:
#   - postgres:    PostgreSQL Database (port 5432)
#   - pgadmin:     Database Admin UI (port 8080)
#   - emqx:        MQTT Broker (ports 1883, 8083, 18083)
#   - backend:     NestJS API (port 3000)
#   - db_scripts:  Automated backup & partition management
# ============================================================
